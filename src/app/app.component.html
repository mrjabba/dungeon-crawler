<div class="tile">
  <header class="title title-background">
    <h1>⚔️ Dungeon Crawler ⚔️</h1>
    <p class="subtitle">Navigate the dungeon. Collect items. Survive.</p>
  </header>
  @if (startingRoomId) {
  <main class="game-area">
    <room-decorator [startingRoomId]="startingRoomId"></room-decorator>
  </main>
  }
  <footer class="controls-hint">
    <span>Use</span> <kbd>W A S D</kbd> <span>or</span> <kbd>↑ ← ↓ →</kbd> <span>to navigate,</span> <kbd>I</kbd> <span>for items,</span> <kbd>Enter</kbd> <span>to take or drop,</span> <kbd>Esc</kbd> <span>to exit</span>
  </footer>
</div>
